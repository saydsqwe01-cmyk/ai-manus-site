<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/manus-storage/marole-ai-logo_2ef1c0a1.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Marole AI</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f8f8f8; }
      #marole-loader { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; overflow: hidden; background: #f8f8f8; color: #1f1f1f; isolation: isolate; transition: opacity .35s ease, visibility .35s ease; }
      #marole-loader::before { content: ""; position: absolute; inset: -35%; z-index: -1; opacity: .42; background-image: radial-gradient(circle, rgba(20,20,20,.2) 1px, transparent 1.2px); background-size: 14px 14px; transform: rotate(-5deg) scale(1.05); animation: marole-dots 18s linear infinite; }
      #marole-loader::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 48%, rgba(255,255,255,.94), rgba(248,248,248,.72) 34%, rgba(248,248,248,.96) 74%); }
      #marole-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      #marole-brand { display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; z-index: 1; }
      #marole-brand img { width: 78px; height: 78px; object-fit: contain; border-radius: 22px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.12)); }
      #marole-brand span { font: 700 22px/1.2 system-ui, sans-serif; letter-spacing: -.02em; }
      #marole-brand em { color: #777; font: 13px/1.4 system-ui, sans-serif; font-style: normal; }
      #marole-spinner { width: 24px; height: 24px; border: 2px solid rgba(31,31,31,.18); border-top-color: #1f1f1f; border-radius: 50%; animation: marole-spin 1s linear infinite; }
      @keyframes marole-dots { 0%,100% { transform: rotate(-5deg) translate3d(0,0,0) scale(1.05); } 50% { transform: rotate(-5deg) translate3d(18px,-12px,0) scale(1.05); } }
      @keyframes marole-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #marole-loader::before, #marole-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="marole-loader" aria-label="Loading Marole AI">
      <div id="marole-brand">
        <img src="/manus-storage/marole-ai-logo_2ef1c0a1.png" alt="Marole AI" />
        <span>Marole AI</span>
        <em>Preparing your AI workspace…</em>
      </div>
      <div id="marole-spinner" aria-hidden="true"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
